<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/contact.css">

</head>

<body>

    <!-- HEADER -->
    <div id="gencomp-header"></div>

    <!-- MAIN -->
<main class="main-body">

    <section id="contact">

        <form id="contactForm" class="contact-container">

            <h1>Contacto</h1>

            <p>
                ¿Tenés alguna consulta? Enviános un mensaje.
            </p>

            <label for="contactName">
                Nombre
            </label>

            <input
                type="text"
                id="contactName"
                placeholder="Ingrese su nombre">

            <small id="errorName" class="error-message"></small>

            <label for="contactEmail">
                Mail
            </label>

            <input
                type="email"
                id="contactEmail"
                placeholder="ejemplo@email.com">

            <small id="errorEmail" class="error-message"></small>

            <label for="contactMessage">
                Mensaje
            </label>

            <textarea
                id="contactMessage"
                rows="6"
                placeholder="Escriba su mensaje"></textarea>

            <small id="errorMessage" class="error-message"></small>

            <button
                type="submit"
                id="btnSend">

                Enviar

            </button>

        </form>

    </section>

</main>

    <!-- FOOTER -->
    <div id="gencomp-footer"></div>

    <script src="../js/navigation.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/componentLoader.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/contact.js"></script>

</body>

</html>
