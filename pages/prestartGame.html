<html lang="en">

<head>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dedicated/prestartGame.css">

<body>
    <!--HEADER-->
    <div id="gencomp-header"></div>
    <!--HEADER-->

    <main class="main-body">
        <section class="main-menu">
            <h2>Configurar Partida</h2>
            <label for="selectDeck">Seleccionar mazo</label>

            <div class="progressive-mode">

            <button type="button" id="btnStartGame">Empezar partida</button>
        </section>
    </main>
    <!--MAIN-->

    <!--FOOTER-->
    <div id="gencomp-footer"></div>

    <script src="../js/game.js"></script>
    <script src="../js/dedicated/soundController.js"></script>
    <script src="../js/dedicated/prestartController.js"></script>
