<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dedicated/finalScreen.css">
</head>

<body>
    <!--HEADER-->
    <div id="gencomp-header"></div>
    <!--HEADER-->

    <!--MAIN-->
    <main class="main-body">
        <section class="results-container">
            <!-- Título principal (Victoria / Derrota) -->
            <h2 id="gameResultTitle" class="results-title">¡Victoria!</h2>
            <p class="results-subtitle">Estadísticas finales de la partida</p>

            <!-- GRID DE CARDS DE ESTADÍSTICAS -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Tiempo</span>
                    <div class="stat-value"><span id="statTime">0</span><small>s</small></div>
                </div>

                <div class="stat-card highlight">
                    <span class="stat-label">Puntaje Final</span>
                    <div class="stat-value" id="statScore">0</div>
                </div>

                <div class="stat-card">
                    <span class="stat-label">Intento</span>
                    <div class="stat-value" id="statAttempt">1</div>
                </div>

                <div class="stat-card success">
                    <span class="stat-label">Aciertos</span>
                    <div class="stat-value" id="statMatches">0</div>
                </div>

                <div class="stat-card danger">
                    <span class="stat-label">Fallos</span>
                    <div class="stat-value" id="statFailures">0</div>
                </div>

                <!-- NUEVO: Cantidad de rachas/combos -->
                <div class="stat-card streak">
                    <span class="stat-label">Racha Máxima</span>
                    <div class="stat-value"><span id="statStreak">0</span><small>x</small></div>
                </div>
            </div>

            <!-- ACCIONES / BOTONES -->
            <div class="results-actions">
                <button type="button" id="btnRestart" class="btn btn-primary">Reiniciar partida</button>
                <button type="button" id="btnConfig" class="btn btn-secondary">Cambiar configuración</button>
                <button type="button" id="btnMainMenu" class="btn btn-outline">Volver al menú</button>
            </div>
        </section>
    </main>
    <!--MAIN-->

    <!--FOOTER-->
    <div id="gencomp-footer"></div>
    <!--FOOTER-->
    <script src="../js/common.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/game.js"></script>
    <script src="../js/componentLoader.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dedicated/soundController.js"></script>
    <script src="../js/dedicated/finalScreenController.js"></script>
</body>

</html>
