<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/game.css">
</head>

<body>
    <!--HEADER-->
    <div id="gencomp-header"></div>
    <!--HEADER-->

    <!--MAIN-->
    <main class="main-body">
        <section class="game-hud">
            <div class="hud-group hud-left">
                <div class="deck-card">
                    <span class="hud-label">MAZO</span>
                    <span id="deckNameText" class="deck-title">Pokémon</span>
                </div>
                <div class="hud-sub-info">
                    <div class="badge-item">
                        <span class="badge-label">INTENTO</span>
                        <span id="retryCountText" class="badge-value">#1</span>
                    </div>
                </div>
            </div>

            <div class="hud-group hud-center">
                <div class="timer-card">
                    <span class="hud-label">TIEMPO</span>
                    <div id="timerText" class="digital-clock">02:45</div>
                </div>
                <div class="score-card">
                    <span class="hud-label">PUNTAJE</span>
                    <span id="scoreElement" class="score-value">02,450</span>
                </div>
            </div>

            <div class="hud-group hud-right">
                <div class="stat-box error-box">
                    <span class="hud-label">ERRORES</span>
                    <span id="errorsCountText" class="stat-value">0</span>
                </div>
                <div class="stat-box streak-box">
                    <span class="hud-label">COMBO</span>
                    <span id="streakText" class="stat-value">x3</span>
                </div>
                <button id="endgameButton" type="button" class="btn-endgame">
                    <span>Finalizar</span>
                </button>
            </div>
        </section>
        <section id="tableBoard">
            <!-- El bucle se generará dinámicamente aquí más adelante -->
            <div class="tableCard"></div>
        </section>
    </main>
    <div id="levelUpOverlay" class="level-up-overlay hidden">
        <div class="level-up-card">
            <span class="level-up-badge">¡NIVEL COMPLETADO!</span>
            <h2 id="levelUpTitle">Avanzando al Nivel 2</h2>
            <p id="levelUpDesc">Preparándote para la nueva dificultad...</p>
            <div class="level-up-timer-bar"></div>
        </div>
    </div>
    <!--MAIN-->

    <!--FOOTER-->
    <div id="gencomp-footer"></div>
    <!--FOOTER-->
    <script src="../js/navigation.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/game.js"></script>
    <script src="../js/componentLoader.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/dedicated/soundController.js"></script>
    <script src="../js/dedicated/gameController.js"></script>
</body>

</html>
