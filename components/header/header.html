<header class="main-header">
    <div class="logo">
        <h1>Memotest</h1>
    </div>

    <nav class="nav-menu">
        <a href="#" id="navHome">Inicio</a>
        <a href="#" id="navStats">Ver Rankings</a>
        <button type="button" id="btnTheme">🌙</button>
        <button type="button" id="btnLogout">Logout</button>
    </nav>
</header>

<div id="rankingModal" class="modal hidden">
    <div class="modal-content">

        <h2>Ranking de partidas</h2>

        <div class="ranking-controls">
            <label for="rankingSort">Ordenar por:</label>

            <select id="rankingSort">
                <option value="score">Puntaje</option>
                <option value="date">Fecha</option>
                <option value="duration">Duración</option>
                <option value="difficulty">Nivel</option>
            </select>
        </div>

        <table id="rankingTable">
            <thead>
                <tr>
                    <th>Jugador</th>
                    <th>Puntaje</th>
                    <th>Nivel</th>
                    <th>Intentos</th>
                    <th>Errores</th>
                    <th>Duración</th>
                    <th>Fecha y hora</th>
                </tr>
            </thead>

            <tbody id="rankingTableBody">
            </tbody>
        </table>

        <div class="ranking-actions">
            <button type="button" id="btnClearRanking">
                Borrar historial
            </button>

            <button type="button" id="btnCloseRanking">
                Cerrar
            </button>
        </div>

    </div>
</div>

<script src="header.js"></script>
