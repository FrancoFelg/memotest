<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memotest</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="components/header/header.css">
    <link rel="stylesheet" href="components/footer/footer.css">
</head>

<body>

    <!-- HEADER -->
    <div id="gencomp-header"></div>

    <!-- MAIN -->
    <main class="main-body">

        <section id="index">

            <form id="loginForm" class="login-form-container">

                <h1>MEMOTEST</h1>

                <p>
                    Poné tu nombre de entrenador para comenzar la aventura.
                </p>

                <label for="nombreUsuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="nombreUsuario"
                    placeholder="Ej: Ash Ketchum">

                <button
                    type="button"
                    id="loginButton">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->
    <div id="gencomp-footer"></div>

    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/validations.js"></script>
    <script src="js/componentLoader.js"></script>
    <script src="js/login.js"></script>
    <script src="js/dedicated/startMenu.js"></script>

</body>

</html>
